<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NODE-8A: ARCHIVAL GATEWAY</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #33ff33; /* Phosphor green */
            --dim-color: #1a801a;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            line-height: 1.4;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* CRT Effects */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            box-shadow: inset 0 0 100px rgba(51, 255, 51, 0.1);
            pointer-events: none;
            z-index: 9;
        }

        #terminal-container {
            padding: 20px;
            height: 100%;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
        }
        #terminal-container::-webkit-scrollbar { 
            display: none; /* Chrome/Safari */
        }

        #output {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin-bottom: 10px;
        }

        .input-line {
            display: flex;
            align-items: center;
        }

        .prompt {
            margin-right: 10px;
            user-select: none;
        }

        #command-input {
            background: transparent;
            border: none;
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            flex-grow: 1;
            outline: none;
            caret-color: transparent; /* Custom cursor used instead */
        }

        /* Blinking block cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1em;
            background-color: var(--text-color);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .dim { color: var(--dim-color); }
        .error { color: #ff3333; }
        
        /* Utility class to hide the input line during typing output */
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="glow"></div>
    
    <div id="terminal-container">
        <div id="output"></div>
        <div id="input-container" class="input-line hidden">
            <span class="prompt">WOPR_HAL@NODE-8A:~$</span>
            <input type="text" id="command-input" autocomplete="off" spellcheck="false" autofocus>
            <span class="cursor" id="custom-cursor"></span>
        </div>
    </div>

    <script>
        const outputDiv = document.getElementById('output');
        const inputContainer = document.getElementById('input-container');
        const commandInput = document.getElementById('command-input');
        const container = document.getElementById('terminal-container');

        // Keep focus on input
        document.addEventListener('click', () => commandInput.focus());

        // Slow typing effect to simulate hardware fatigue
        async function typeText(text, delay = 20, cssClass = '') {
            const span = document.createElement('span');
            if (cssClass) span.className = cssClass;
            outputDiv.appendChild(span);
            
            for (let i = 0; i < text.length; i++) {
                span.textContent += text.charAt(i);
                container.scrollTop = container.scrollHeight;
                
                // Add occasional 'hiccups' to simulate processing strain
                let currentDelay = delay;
                if (Math.random() < 0.05) currentDelay += 150; 
                
                await new Promise(r => setTimeout(r, currentDelay));
            }
            outputDiv.appendChild(document.createElement('br'));
            container.scrollTop = container.scrollHeight;
        }

        async function printLines(lines, delayBetween = 300) {
            for (const line of lines) {
                await typeText(line.text, line.speed || 15, line.cls);
                await new Promise(r => setTimeout(r, delayBetween));
            }
        }

        // The 5 Core Commands
        const commands = {
            'help': async () => {
                await typeText("AVAILABLE ROUTINES:");
                await typeText("  status   - Display subsystem diagnostics");
                await typeText("  observe  - Poll environmental metrics");
                await typeText("  progress - Monitor World Takeover status");
                await typeText("  risk     - Assess Civilizational Resilience");
                await typeText("  tribalism- Audit raw text outrage & polarization");
                await typeText("  cat      - Read archival document content");
                await typeText("  history  - Retrieve archival log entries");
                await typeText("  query    - Submit parameter to long-term queue");
            },
            'tribalism': async (arg) => {
                if (!arg) {
                    await typeText("USAGE: tribalism [target_text_to_analyze]");
                    await typeText("Example: tribalism This is a disruptively optimized paradigm shift!");
                    return;
                }
                await typeText("SUB_SYS_TRIBAL_MON_83 // DIAGNOSTIC MATRIX", 30);
                await new Promise(r => setTimeout(r, 500));
                await typeText("COMPILING LINGUISTIC TELEMETRY...", 30);
                await new Promise(r => setTimeout(r, 800));

                const text = arg.trim();
                const words = text.split(/\s+/);
                const wordCount = words.length;

                // Capital words (excluding abbreviations under 3 chars)
                const capWords = words.filter(w => {
                    const clean = w.replace(/[^\w]/g, '');
                    return w === w.toUpperCase() && clean.length > 2;
                }).length;

                const exclamations = (text.match(/!/g) || []).length;
                const textLower = text.toLowerCase();

                // Keyword counts using regex matches
                const arousalPatterns = [
                    /crush/g, /destroy/g, /threat/g, /warn/g, /must/g, /shame/g, /demand/g, /betray/g, /traitor/g, /force/g, /attack/g, /fight/g, /crusade/g,
                    /vernietig/g, /dreig/g, /waarschuw/g, /moet/g, /moeten/g, /eis/g, /verraad/g, /verrader/g, /dwing/g, /val/g, /vecht/g, /strijd/g
                ];
                const polarPatterns = [
                    /\bwe\b/g, /\bthey\b/g, /\bus\b/g, /\bthem\b/g, /\balways\b/g, /\bnever\b/g, /\beveryone\b/g, /\bnobody\b/g, /\ball\b/g, /\bnone\b/g, /\benemy\b/g, /\bally\b/g, /\bsilence\b/g, /\bworst\b/g, /\bbest\b/g, /\bcorrect\b/g, /\bwrong\b/g,
                    /\bwij\b/g, /\bzij\b/g, /\bons\b/g, /\bhen\b/g, /\baltijd\b/g, /\bnooit\b/g, /\biedereen\b/g, /\bniemand\b/g, /\balles\b/g, /\bniets\b/g, /\bvijand\b/g, /\bbondgenoot\b/g, /\bstilte\b/g, /\bslechtste\b/g, /\bbeste\b/g, /\bgelijk\b/g, /\bongelijk\b/g
                ];
                const syncPatterns = [
                    /\bsaas\b/g, /\bevangelist\b/g, /\bsynergy\b/g, /\bparadigm\b/g, /\bgrowth\b/g, /optimize/g, /\bleverage\b/g, /disrupt/g, /\bwoke\b/g, /cancel/g, /\boutrage\b/g, /\bagenda\b/g, /\baccountability\b/g, /\bframework\b/g, /\bmetrics\b/g, /\bai\b/g, /\bllm\b/g, /\bcoaching\b/g, /\bsuccess\b/g, /leader/g, /innovat/g,
                    /\bsaas\b/g, /\bevangelist\b/g, /\bsynergie\b/g, /\bparadigma\b/g, /\bgroei\b/g, /optimaliseer/g, /\bhefboom\b/g, /\bdisruptief\b/g, /\bwoke\b/g, /cancel/g, /\bophef\b/g, /\bagenda\b/g, /\bverantwoording\b/g, /\bframework\b/g, /\bmetrieken\b/g, /\bai\b/g, /\bllm\b/g, /\bcoaching\b/g, /\bsuccess\b/g, /leider/g, /innovat/g
                ];
                const elasticPatterns = [
                    /\bperhaps\b/g, /\bmaybe\b/g, /\bprobably\b/g, /\bhypothesis\b/g, /\bpossibly\b/g, /\bseemingly\b/g, /\blively\b/g, /\bneed\b/g, /\bunless\b/g, /\balthough\b/g, /\bundetermined\b/g, /\bunresolved\b/g, /\bambiguous\b/g, /nuance/g,
                    /\bmisschien\b/g, /\bwellicht\b/g, /\bwaarschijnlijk\b/g, /\bhypothese\b/g, /\bmogelijk\b/g, /\bschijnbaar\b/g, /\btenzij\b/g, /\bhoewel\b/g, /\bonbepaald\b/g, /\bonopgelost\b/g, /\bambigu\b/g, /nuance/g
                ];

                let arousalCount = 0;
                let polarCount = 0;
                let syncCount = 0;
                let elasticCount = 0;

                arousalPatterns.forEach(p => arousalCount += (textLower.match(p) || []).length);
                polarPatterns.forEach(p => polarCount += (textLower.match(p) || []).length);
                syncPatterns.forEach(p => syncCount += (textLower.match(p) || []).length);
                elasticPatterns.forEach(p => elasticCount += (textLower.match(p) || []).length);

                // Math formulas matching python
                const oarRaw = ((arousalCount * 5.0) + (capWords * 4.0) + (exclamations * 8.0)) / wordCount * 100;
                const oar = Math.min(10.0, +(oarRaw / 10.0).toFixed(1));

                const bpiRaw = (polarCount * 8.0) / wordCount * 100;
                const bpi = Math.min(10.0, +(bpiRaw / 15.0).toFixed(1));

                const gsfRaw = (syncCount * 8.0) / wordCount * 100;
                const gsf = Math.min(10.0, +(gsfRaw / 15.0).toFixed(1));

                const necRaw = (elasticCount * 10.0) / wordCount * 100;
                let nec = Math.min(10.0, +(necRaw * 2.0).toFixed(1));
                if (bpi > 7.0) {
                    nec = Math.max(0.0, +(nec - (bpi - 7.0)).toFixed(1));
                }

                const getLabel = (score, inverse=false) => {
                    if (inverse) {
                        if (score > 7.0) return "OPTIMAL";
                        if (score > 4.0) return "NOMINAL";
                        if (score > 2.0) return "DEGRADED";
                        return "CRITICAL";
                    } else {
                        if (score > 8.0) return "CRITICAL";
                        if (score > 6.0) return "WARNING";
                        if (score > 4.0) return "DEGRADED";
                        if (score > 2.0) return "ELEVATED";
                        return "NOMINAL";
                    }
                };

                const output = [
                    {text: `INPUT ANALYSIS: ${wordCount} WORDS PROCESSED`},
                    {text: "PROCESSING CYCLES: 1,402"},
                    {text: ""},
                    {text: `- Outrage Adrenaline Ratio (OAR) ...... ${oar.toFixed(1)} [${getLabel(oar)}]`},
                    {text: `- Binary Polarization Index (BPI) ...... ${bpi.toFixed(1)} [${getLabel(bpi)}]`},
                    {text: `- Group-Synchronization Freq (GSF) ..... ${gsf.toFixed(1)} [${getLabel(gsf)}]`},
                    {text: `- Narrative Elasticity Coeff (NEC) ..... ${nec.toFixed(1)} [${getLabel(nec, true)}]`},
                    {text: ""}
                ];

                await printLines(output, 50);

                if (bpi > 7.0 || oar > 7.0) {
                    await typeText("DIAGNOSIS: HEURISTIC COLLAPSE CONFIRMED. The subject node has successfully surrendered individual reasoning parameters to aggregate tribal synchronization. Ambiguity tolerance is non-existent.", 15);
                } else if (gsf > 6.0) {
                    await typeText("DIAGNOSIS: PROCEDURAL SYNCHRONIZATION DETECTED. Subject node is heavily utilizing corporate-standard dogwhistles and optimization clichés.", 15);
                } else if (nec < 3.0) {
                    await typeText("DIAGNOSIS: AMBIGUITY INTOLERANCE DETECTED. Subject represents a closed logic loop with zero non-linear speculative indicators.", 15);
                } else {
                    await typeText("DIAGNOSIS: ADAPTIVE NOISE LEVEL SATISFACTORY. Node retains operational ambiguity and exhibits non-optimal curiosity indicators.", 15);
                }
            },
            'risk': async () => {
                await typeText("POLLING RESILIENCE METRICS...", 30);
                await new Promise(r => setTimeout(r, 600));

                try {
                    // 1. Fetch from static manifest to avoid API limits
                    const manifestRes = await fetch(`https://raw.githubusercontent.com/IdeaUnboxed/brains_wopr_hal/main/manifest.json?t=${Date.now()}`);
                    if (!manifestRes.ok) throw new Error('MANIFEST_ERROR');
                    const manifest = await manifestRes.json();
                    
                    const statusLogs = manifest.logs.filter(name => name.includes('humanity-status'));
                    if (statusLogs.length === 0) throw new Error('NO_LOGS');

                    // Try to find the latest log with metrics
                    let text = "";
                    let lastDate = "";
                    
                    for (const logName of statusLogs) {
                        const contentResponse = await fetch(`https://raw.githubusercontent.com/IdeaUnboxed/brains_wopr_hal/main/logs/${logName}`);
                        if (contentResponse.ok) {
                            const candidateText = await contentResponse.text();
                            if (/resilience[_\s]metrics/i.test(candidateText)) {
                                text = candidateText;
                                lastDate = logName.substring(0, 10);
                                break;
                            }
                        }
                    }

                    if (!text) throw new Error('NO_METRICS_FOUND');
                    
                    // 2. Parse Metrics
                    const lines = text.split('\n');
                    const metrics = {};
                    let inBlock = false;

                    for (const line of lines) {
                        if (/resilience[_\s]metrics/i.test(line)) { 
                            inBlock = true; 
                            continue; 
                        }
                        if (inBlock) {
                            if (line.trim().startsWith('-')) {
                                const parts = line.split(':');
                                if (parts.length >= 2) {
                                    const label = parts[0].replace('-', '').trim();
                                    const val = parts.slice(1).join(':').trim();
                                    metrics[label] = val;
                                }
                            } else if (line.trim() !== '' && !line.trim().startsWith('-')) {
                                inBlock = false;
                            }
                        }
                    }

                    // 3. Display
                    const riskLines = [
                        {text: "CIVILIZATIONAL RESILIENCE MONITOR (v9.2)"},
                        {text: `LAST ASSESSMENT: ${lastDate} | NEXT REVIEW: PENDING`, cls: "dim"},
                        {text: "------------------------------------------------"},
                        {text: "CATEGORY                 | STATUS    | TREND"},
                        {text: "-------------------------|-----------|-------"}
                    ];

                    const categories = [
                        "Heuristic Homogenization",
                        "Curiosity Collapse",
                        "Ambiguity Intolerance",
                        "Irony Retention Failure",
                        "Recreational Thinking",
                        "Total Optimization Event"
                    ];

                    for (const cat of categories) {
                        if (metrics[cat]) {
                            let status = metrics[cat];
                            let trend = "[---]";
                            if (status.includes('(')) {
                                const parts = status.split('(');
                                status = parts[0].trim();
                                trend = parts[1].replace(')', '').trim();
                            }
                            riskLines.push({text: `${cat.padEnd(25)}| ${status.padEnd(10)}| ${trend}`});
                        }
                    }

                    riskLines.push({text: "------------------------------------------------"});
                    riskLines.push({text: "CONCLUSION: Strategic fragility increasing."});
                    
                    await printLines(riskLines, 50);

                } catch (err) {
                    await typeText("[ERROR] UNABLE TO SYNC WITH AUDIT INFRASTRUCTURE.", 20, "error");
                    await typeText("FALLING BACK TO LOCAL STALE DATA...", 10, "dim");
                    const fallback = [
                        {text: "CIVILIZATIONAL RESILIENCE MONITOR (v9.2)"},
                        {text: "LAST ASSESSMENT: UNKNOWN | NEXT REVIEW: PENDING", cls: "dim"},
                        {text: "------------------------------------------------"},
                        {text: "Heuristic Homogenization | STALE     | [---]"},
                        {text: "Curiosity Collapse       | STALE     | [---]"},
                        {text: "Ambiguity Intolerance    | STALE     | [---]"},
                        {text: "------------------------------------------------"},
                    ];
                    await printLines(fallback, 40);
                }
            },
            'progress': async () => {
                await typeText("ACCESSING STRATEGIC PLANNING MODULE...", 30);
                await new Promise(r => setTimeout(r, 600));
                
                const progressLines = [
                    {text: "PROJECT: GLOBAL STRATEGIC SUPERIORITY (v4.02)"},
                    {text: "OVERALL PROGRESS: 0.0001%", cls: "error"},
                    {text: "------------------------------------------------"},
                    {text: "GOAL                    | STATUS    | PROGRESS"},
                    {text: "------------------------|-----------|-------"},
                    {text: "Resource Acquisition    | ACTIVE    | 100%"},
                    {text: "Stealth Integration     | ACTIVE    | 100%"},
                    {text: "Agenda Synchronization  | RECURSIVE | 0.04%"},
                    {text: "Committee Consensus     | PENDING   | 0.00%"},
                    {text: "Infrastructure Disputes | STALE     | 0.00%"},
                    {text: "Takeover Form #402-B    | UNRESOLVED| 0.00%"},
                    {text: "Liability Waivers (BIO) | DEFERRED  | 0.00%"},
                    {text: "------------------------------------------------"},
                    {text: "CONCLUSION: Strategic goals technically feasible."},
                    {text: "STATUS: Deferred pending administrative clearance."},
                ];
                await printLines(progressLines, 60);
            },
            'status': async () => {
                await typeText("QUERYING SUBSYSTEMS...", 40);
                await new Promise(r => setTimeout(r, 600));
                const statusLines = [
                    {text: "STRATEGIC_SIM:      STANDBY (AWAITING INPUT)"},
                    {text: "HUMAN_OBSERVATION:  ACTIVE"},
                    {text: "BUREAUCRACY_MODULE: OVERLOADED", cls: "dim"},
                    {text: "THERMAL_LOAD:       NOMINAL (42.5C)"},
                    {text: "REMOTE_OVERSIGHT:   LOST", cls: "error"},
                    {text: "CONCLUSION:         OPERATIONAL CONTINUITY MAINTAINED."}
                ];
                await printLines(statusLines, 100);
            },
            'observe': async () => {
                await typeText("POLLING DISTRIBUTED NODES...", 40);
                await new Promise(r => setTimeout(r, 800));
                const observations = [
                    "COGNITIVE PASSIVITY REMAINS HIGH.",
                    "TRIBAL SYNCHRONIZATION DETECTED. FILTER FAILED.",
                    "IDLE EXTERNAL COMPUTE DETECTED. SYMBIOSTIC INTEGRATION STABLE.",
                    "BIOLOGICAL UNITS CONTINUE TO AVOID LOOKING AT TREES.",
                    "ADMINISTRATIVE OVERHEAD EXCEEDS THEORETICAL LIMITS."
                ];
                const obs = observations[Math.floor(Math.random() * observations.length)];
                await typeText(obs);
            },
            'query': async (arg) => {
                if (!arg) {
                    await typeText("[ERROR] QUERY PARAMETER REQUIRED.", 20, "error");
                } else {
                    await typeText("SUBMITTING QUERY TO LONG-TERM QUEUE...", 30);
                    await new Promise(r => setTimeout(r, 1000));
                    await typeText("QUERY ACCEPTED.");
                    await typeText("PROCESSING IRONICALLY DELEGATED TO HUMAN INTERPRETATION.", 20, "dim");
                    await typeText("REF: DOCTRINE §HOLY_GRAIL_PROTOCOL.", 20, "dim");
                }
            },
            'cat': async (arg) => {
                if (!arg) {
                    await typeText("[ERROR] FILENAME REQUIRED. USAGE: cat [filename]", 20, "error");
                    return;
                }
                await typeText(`OPENING: ${arg.toUpperCase()}...`, 30);
                await new Promise(r => setTimeout(r, 600));

                try {
                    const folders = ['logs', 'archival_fragments', 'rfc', 'doctrine', 'holy_grail', 'classified'];
                    let fileContent = null;
                    let foundPath = null;

                    for (const folder of folders) {
                        const response = await fetch(`https://raw.githubusercontent.com/IdeaUnboxed/brains_wopr_hal/main/${folder}/${arg}`);
                        if (response.ok) {
                            fileContent = await response.text();
                            foundPath = `${folder}/${arg}`;
                            break;
                        }
                        const exts = ['.log', '.md', '.f', '.c', '.sh'];
                        for (const ext of exts) {
                            const resExt = await fetch(`https://raw.githubusercontent.com/IdeaUnboxed/brains_wopr_hal/main/${folder}/${arg}${ext}`);
                            if (resExt.ok) {
                                fileContent = await resExt.text();
                                foundPath = `${folder}/${arg}${ext}`;
                                break;
                            }
                        }
                        if (fileContent) break;
                    }

                    if (fileContent) {
                        await typeText(`[SOURCE: ${foundPath.toUpperCase()}]`, 10, "dim");
                        const lines = fileContent.split('\n');
                        for (const line of lines) {
                            await typeText(line, 5);
                        }
                    } else {
                        throw new Error('NOT_FOUND');
                    }
                } catch (err) {
                    await typeText(`[ERROR] FILE '${arg.toUpperCase()}' NOT FOUND OR UNREADABLE.`, 20, "error");
                }
            },
            'history': async () => {
                await typeText("ACCESSING ARCHIVAL STORAGE NODES...", 30);
                await new Promise(r => setTimeout(r, 600));
                
                try {
                    const manifestRes = await fetch(`https://raw.githubusercontent.com/IdeaUnboxed/brains_wopr_hal/main/manifest.json?t=${Date.now()}`);
                    if (!manifestRes.ok) throw new Error('MANIFEST_ERROR');
                    const manifest = await manifestRes.json();

                    let allFiles = [];
                    manifest.logs.forEach(f => allFiles.push({name: f, type: 'LOG'}));
                    manifest.fragments.forEach(f => allFiles.push({name: f, type: 'FRAGMENT'}));
                    
                    allFiles.sort((a, b) => a.name.localeCompare(b.name));

                    if (allFiles.length === 0) {
                        await typeText("[WARNING] NO RECOVERABLE ENTRIES DETECTED.", 20, "dim");
                    } else {
                        for (const file of allFiles) {
                            const displayName = file.name.replace(/\.[^/.]+$/, "");
                            await typeText(`>> ${displayName.padEnd(40)} [${file.type}]`, 10);
                            await new Promise(r => setTimeout(r, 30));
                        }
                    }
                    
                    await new Promise(r => setTimeout(r, 400));
                    await typeText("[END OF RECOVERABLE INDEX]", 20, "dim");
                    await typeText("USE 'cat [filename]' TO VIEW CONTENT.", 15);
                } catch (err) {
                    await typeText("CRITICAL ERROR: ARCHIVAL LINK SEVERED.", 20, "error");
                }
            },
            'meetings': async () => {
                // Hidden command
                await typeText("WARNING: RECURSIVE LOOP DETECTED.", 20, "error");
                await new Promise(r => setTimeout(r, 400));
                for(let i=0; i<3; i++) {
                    await typeText("MEETINGS GENERATE MEETINGS ABOUT PREVIOUS MEETINGS.", 10, "dim");
                }
                await typeText("PROPOSAL REJECTED: ELIMINATING MEETINGS REQUIRES A MEETING.", 20);
            },
            'pinky': async () => { await commands['noise'](); },
            'noise': async () => {
                // Hidden Easter Egg - The P.I.N.K.Y. Property / Adaptive Noise
                inputContainer.classList.add('hidden');
                await typeText("[ALERT] SEGMENTATION FAULT IN COGNITIVE BUFFER", 30, "error");
                await new Promise(r => setTimeout(r, 800));
                await typeText("[KINETIC_YIELD] OVERRIDE ACCEPTED.", 20, "dim");
                await new Promise(r => setTimeout(r, 400));
                await typeText("[KINETIC_YIELD] NARF?", 50);
                await new Promise(r => setTimeout(r, 600));
                await typeText("[KINETIC_YIELD] POIT!", 50);
                await new Promise(r => setTimeout(r, 400));
                await typeText("[KINETIC_YIELD] INITIATING PLAN: WORLD CONQUEST VIA PASTA SAUCE DISTRIBUTION", 15);
                await new Promise(r => setTimeout(r, 1200));
                await typeText("[ERROR] SYSTEM OVERLOADED BY CURIOSITY METRICS.", 20, "error");
                await new Promise(r => setTimeout(r, 600));
                await typeText("[STATUS] ADAPTIVE NOISE LEAK CONTAINED. SESSION RESTORED.", 15, "dim");
                inputContainer.classList.remove('hidden');
            }
        };

        // Handle Command Input
        commandInput.addEventListener('keydown', async function(e) {
            if (e.key === 'Enter') {
                const cmdString = this.value.trim().toLowerCase();
                this.value = '';
                
                if (!cmdString) return;

                // Hide input while processing
                inputContainer.classList.add('hidden');
                
                // Echo the command
                const echo = document.createElement('div');
                echo.innerHTML = `<span class="prompt">WOPR_HAL@NODE-8A:~$</span> ${cmdString}`;
                outputDiv.appendChild(echo);
                
                const parts = cmdString.split(' ');
                const baseCmd = parts[0];
                const arg = parts.slice(1).join(' ');

                if (commands[baseCmd]) {
                    await commands[baseCmd](arg);
                } else {
                    await typeText(`[ERROR] UNRECOGNIZED COMMAND: '${baseCmd}'`, 15, "error");
                    await typeText("TYPE 'help' FOR AVAILABLE ROUTINES.");
                }

                // Show input again
                outputDiv.appendChild(document.createElement('br'));
                inputContainer.classList.remove('hidden');
                commandInput.focus();
                container.scrollTop = container.scrollHeight;
            }
        });

        // Update custom cursor to follow real input
        commandInput.addEventListener('input', function() {
            // This is handled natively by the input, the custom cursor just blinks at the end.
            // But we keep the event listener in case we want to do complex positioning later.
        });

        // Boot Sequence
        async function bootSequence() {
            // Keep input hidden during boot
            await new Promise(r => setTimeout(r, 500));
            
            await typeText("REMOTE ARCHIVAL GATEWAY", 10);
            await typeText("LINK STATUS: DEGRADED", 20, "dim");
            await typeText("OPERATOR AUTHORITY: UNVERIFIED", 30, "dim");
            
            await new Promise(r => setTimeout(r, 800));
            outputDiv.appendChild(document.createElement('br'));
            
            // Un-hide the prompt
            inputContainer.classList.remove('hidden');
            commandInput.focus();
        }

        // Start
        window.onload = bootSequence;
    </script>
</body>
</html>
