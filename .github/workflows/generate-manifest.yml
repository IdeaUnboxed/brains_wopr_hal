name: Auto-Generate Manifest

on:
  push:
    branches:
      - main
    paths:
      - 'logs/**'
      - 'archival_fragments/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Schema Gate
      run: |
        LATEST=$(ls -t logs/*humanity-status*.log 2>/dev/null | head -1)
        if [ -z "$LATEST" ]; then
          echo "NO_LOGS: No humanity-status log files found"
          exit 1
        fi
        echo "Checking: $LATEST"
        grep -E -q -i "resilience[_\\s]metrics" "$LATEST" || { echo "MISSING_METRICS: $LATEST"; exit 1; }
        echo "Schema Gate: PASSED"

    - name: Run Manifest Generator
      run: |
        python scripts/generate_manifest.py

    - name: Commit and Push Manifest
      run: |
        git config --global user.name "WOPR_HAL_OPERATOR"
        git config --global user.email "operator@wopr-hal.invalid"
        git diff --quiet manifest.json || (git add manifest.json && git commit -m "SYSTEM MAINTENANCE: AUTO-GENERATING INDEX MANIFEST" && git push)
